<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vless 节点转 Clash YAML 工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f4f6f9; color: #222; padding: 24px; }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 18px; }
  label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 180px; border: 1px solid #ccc; border-radius: 8px; padding: 12px; font-family: Consolas, monospace; font-size: 13px; resize: vertical; }
  .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button { padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #e5e7eb; color: #222; }
  .btn-secondary:hover { background: #d1d5db; }
  .btn-success { background: #059669; color: #fff; display: none; }
  .btn-success:hover { background: #047857; }
  .stats { font-size: 13px; color: #059669; margin-top: 10px; display: none; }
  .error { font-size: 13px; color: #dc2626; margin-top: 10px; display: none; }
  input[type=file] { font-size: 13px; }
  .tip { font-size: 12px; color: #888; margin-top: 8px; }
  .out-wrap { position: relative; }
  .copy-btn { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 20px; }

  /* ---------- 移动端适配 ---------- */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .container { padding: 0; }
    h1 { font-size: 18px; }
    .card { padding: 14px; }
    .row { flex-direction: column; align-items: stretch; gap: 10px; }
    .row input { width: 100% !important; min-width: 0 !important; flex: none !important; }
    button { width: 100%; }
    textarea { min-height: 140px; font-size: 12px; }
    .copy-btn { position: static; width: auto; }
    .stats, .error, .tip { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>vless 节点 → Clash YAML 转换工具</h1>
  <div class="sub">本地运行，数据不出电脑。粘贴或上传含 <code>vless://</code> 节点的文本，一键生成 Clash / mihomo 订阅配置。</div>

  <div class="card">
    <label for="input">节点列表（每行一条 vless:// 链接）</label>
    <textarea id="input" placeholder="粘贴 vless:// 节点，每行一个...&#10;或点击下方按钮选择文本文件"></textarea>
    <div class="row">
      <input type="file" id="file" accept=".txt,.list,.yaml,.yml,text/plain">
      <button class="btn-primary" id="convertBtn">转换为 Clash YAML</button>
      <button class="btn-success" id="downloadBtn">下载 YAML 文件</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="error" id="error"></div>
    <div class="tip">支持拖入/选择节点文本文件自动填入上方输入框；非 vless:// 开头的行会被自动跳过。</div>
  </div>

  <div class="card out-wrap">
    <label for="output">转换结果（Clash YAML）</label>
    <textarea id="output" readonly placeholder="转换结果将显示在这里..."></textarea>
    <button class="btn-secondary copy-btn" id="copyBtn">复制</button>
  </div>

  <div class="card">
    <label>上传 GitHub 生成订阅链接</label>
    <div class="row">
      <input type="text" id="ghRepo" placeholder="仓库，如 GLeiX1n/marvis-sub" style="flex:1;min-width:200px;padding:10px;border:1px solid #ccc;border-radius:8px;">
      <input type="text" id="ghFile" placeholder="文件名，如 clash_sub.yaml" value="clash_sub.yaml" style="flex:1;min-width:160px;padding:10px;border:1px solid #ccc;border-radius:8px;">
      <input type="text" id="ghBranch" placeholder="分支" value="main" style="width:100px;padding:10px;border:1px solid #ccc;border-radius:8px;">
    </div>
    <div class="row">
      <input type="password" id="ghToken" placeholder="GitHub Token（需 repo 权限）" style="flex:2;min-width:240px;padding:10px;border:1px solid #ccc;border-radius:8px;">
      <input type="text" id="ghMsg" placeholder="commit 信息" value="更新订阅" style="flex:1;min-width:140px;padding:10px;border:1px solid #ccc;border-radius:8px;">
    </div>
    <div class="row">
      <button class="btn-primary" id="uploadBtn">上传并生成订阅链接</button>
    </div>
    <div class="stats" id="uploadStats"></div>
    <div class="error" id="uploadError"></div>
    <div class="tip">调用 GitHub REST API 将当前生成的 YAML 上传到仓库并覆盖同名文件，成功后返回 raw 订阅链接。Token 仅保存在当前页面内存中，刷新页面即失效，不会发送到任何第三方。</div>
  </div>

  <footer>vless_to_clash_web · 单文件离线工具 · 与 Python 版逻辑一致</footer>
</div>

<script>
// ---------- 解析逻辑（与 Python 版一致） ----------
function parseVless(uri) {
  if (!uri.startsWith('vless://')) return null;
  let body = uri.slice('vless://'.length);
  let name = '';
  const hashIdx = body.indexOf('#');
  if (hashIdx >= 0) {
    try { name = decodeURIComponent(body.slice(hashIdx + 1)); } catch (e) { name = body.slice(hashIdx + 1); }
    body = body.slice(0, hashIdx);
  }
  const atIdx = body.indexOf('@');
  if (atIdx < 0) return null;
  const uuid = body.slice(0, atIdx).trim();
  let addrPart = body.slice(atIdx + 1);
  const query = {};
  const qIdx = addrPart.indexOf('?');
  if (qIdx >= 0) {
    const qs = addrPart.slice(qIdx + 1);
    addrPart = addrPart.slice(0, qIdx);
    qs.split('&').forEach(kv => {
      if (!kv) return;
      const i = kv.indexOf('=');
      const k = i >= 0 ? kv.slice(0, i) : kv;
      const v = i >= 0 ? kv.slice(i + 1) : '';
      if (k) query[k] = decodeURIComponent(v);
    });
  }
  let server = addrPart, port = 443;
  const ipv6 = addrPart.match(/^\[([^\]]+)\]:(\d+)$/);
  if (ipv6) {
    server = ipv6[1];
    port = parseInt(ipv6[2], 10);
  } else {
    const idx = addrPart.lastIndexOf(':');
    if (idx > -1 && /^\d+$/.test(addrPart.slice(idx + 1))) {
      server = addrPart.slice(0, idx);
      port = parseInt(addrPart.slice(idx + 1), 10);
    }
  }
  const proxy = {
    name: name || ('vless-' + server + '-' + port),
    type: 'vless',
    server: server,
    port: port,
    uuid: uuid,
    udp: true,
    tls: (query.security || '').toLowerCase() === 'tls'
  };
  const network = query.type || 'tcp';
  if (network) proxy.network = network;
  if (network === 'ws') {
    const wsOpts = {};
    if (query.path) wsOpts.path = query.path;
    if (query.host) wsOpts.headers = { Host: query.host };
    if (Object.keys(wsOpts).length) proxy['ws-opts'] = wsOpts;
  }
  if (query.sni) proxy.servername = query.sni;
  if (query.alpn) proxy.alpn = query.alpn.split(',').filter(Boolean);
  if (query.fp) proxy['client-fingerprint'] = query.fp;
  return proxy;
}

// 对 YAML 标量做安全引用（名称含特殊字符时加单引号）
function yamlQuote(s) {
  if (s === null || s === undefined) return 'null';
  s = String(s);
  if (/[:,\[\]{}#&*!|>'"%@`]/.test(s) || /^\s|\s$/.test(s)) {
    return "'" + s.replace(/'/g, "''") + "'";
  }
  return s;
}

function buildYaml(proxies) {
  const lines = ['proxies:'];
  proxies.forEach(p => {
    lines.push('- name: ' + yamlQuote(p.name));
    lines.push('  type: ' + p.type);
    lines.push('  server: ' + p.server);
    lines.push('  port: ' + p.port);
    lines.push('  uuid: ' + p.uuid);
    lines.push('  udp: ' + p.udp);
    lines.push('  tls: ' + p.tls);
    if (p.network) lines.push('  network: ' + p.network);
    if (p['ws-opts']) {
      lines.push('  ws-opts:');
      if (p['ws-opts'].path) lines.push('    path: ' + yamlQuote(p['ws-opts'].path));
      if (p['ws-opts'].headers) {
        lines.push('    headers:');
        lines.push('      Host: ' + yamlQuote(p['ws-opts'].headers.Host));
      }
    }
    if (p.servername) lines.push('  servername: ' + yamlQuote(p.servername));
    if (p.alpn && p.alpn.length) {
      lines.push('  alpn:');
      p.alpn.forEach(a => lines.push('  - ' + yamlQuote(a)));
    }
    if (p['client-fingerprint']) lines.push('  client-fingerprint: ' + yamlQuote(p['client-fingerprint']));
  });
  const names = proxies.map(p => p.name);
  lines.push('proxy-groups:');
  lines.push('- name: M22-ALL');
  lines.push('  type: select');
  lines.push('  proxies:');
  names.forEach(n => lines.push('    - ' + yamlQuote(n)));
  lines.push('    - DIRECT');
  lines.push('rules:');
  lines.push('- MATCH,DIRECT');
  return lines.join('\n');
}

// ---------- UI 逻辑 ----------
const input = document.getElementById('input');
const output = document.getElementById('output');
const fileInput = document.getElementById('file');
const stats = document.getElementById('stats');
const error = document.getElementById('error');
const downloadBtn = document.getElementById('downloadBtn');

fileInput.addEventListener('change', function () {
  const f = this.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = e => { input.value = e.target.result; stats.style.display = 'none'; error.style.display = 'none'; };
  reader.readAsText(f);
});

document.getElementById('convertBtn').addEventListener('click', function () {
  const text = input.value;
  if (!text.trim()) {
    error.textContent = '请先粘贴或选择节点文件';
    error.style.display = 'block';
    stats.style.display = 'none';
    return;
  }
  const lines = text.split(/\r?\n/);
  const proxies = [];
  let skipped = 0;
  lines.forEach(line => {
    line = line.trim();
    if (!line) return;
    if (!line.startsWith('vless://')) { skipped++; return; }
    const p = parseVless(line);
    if (p) proxies.push(p); else skipped++;
  });
  if (!proxies.length) {
    error.textContent = '未识别到任何有效的 vless:// 节点';
    error.style.display = 'block';
    stats.style.display = 'none';
    return;
  }
  output.value = buildYaml(proxies);
  error.style.display = 'none';
  stats.textContent = '转换成功：' + proxies.length + ' 个节点' + (skipped ? '，跳过 ' + skipped + ' 行非 vless 内容' : '');
  stats.style.display = 'block';
  downloadBtn.style.display = 'inline-block';
});

document.getElementById('downloadBtn').addEventListener('click', function () {
  const blob = new Blob([output.value], { type: 'text/yaml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'clash_sub.yaml';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});

document.getElementById('copyBtn').addEventListener('click', function () {
  if (!output.value) return;
  navigator.clipboard.writeText(output.value).then(() => {
    const b = this;
    b.textContent = '已复制';
    setTimeout(() => { b.textContent = '复制'; }, 1200);
  });
});

// ---------- 上传 GitHub 生成订阅链接 ----------
function b64EncodeUtf8(str) {
  // 先转为 UTF-8 字节，再 Base64，兼容中文节点名
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

document.getElementById('uploadBtn').addEventListener('click', async function () {
  const yaml = output.value;
  const repo = document.getElementById('ghRepo').value.trim();
  const file = document.getElementById('ghFile').value.trim() || 'clash_sub.yaml';
  const branch = document.getElementById('ghBranch').value.trim() || 'main';
  const token = document.getElementById('ghToken').value.trim();
  const msg = document.getElementById('ghMsg').value.trim() || '更新订阅';
  const statsEl = document.getElementById('uploadStats');
  const errEl = document.getElementById('uploadError');
  errEl.style.display = 'none';
  statsEl.style.display = 'none';

  if (!yaml) { errEl.textContent = '请先在"转换结果"中生成 YAML 内容'; errEl.style.display = 'block'; return; }
  if (!repo) { errEl.textContent = '请填写 GitHub 仓库（如 GLeiX1n/marvis-sub）'; errEl.style.display = 'block'; return; }
  if (!token) { errEl.textContent = '请填写 GitHub Token（需要 repo 权限）'; errEl.style.display = 'block'; return; }

  this.disabled = true;
  const originText = this.textContent;
  this.textContent = '上传中...';
  const url = 'https://api.github.com/repos/' + repo + '/contents/' + file + '?ref=' + branch;
  try {
    const resp = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: msg, content: b64EncodeUtf8(yaml), branch: branch })
    });
    const data = await resp.json();
    if (!resp.ok) {
      errEl.textContent = '上传失败（' + resp.status + '）：' + (data.message || resp.statusText);
      errEl.style.display = 'block';
    } else {
      const rawUrl = 'https://raw.githubusercontent.com/' + repo + '/' + branch + '/' + file;
      statsEl.innerHTML = '上传成功！订阅链接：<br><a href="' + rawUrl + '" target="_blank" style="word-break:break-all">' + rawUrl + '</a><br><br>直接在 Clash Verge 订阅栏粘贴导入即可。';
      statsEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = '网络请求失败：' + e.message;
    errEl.style.display = 'block';
  } finally {
    this.disabled = false;
    this.textContent = originText;
  }
});
</script>
</body>
</html>
